<svg xmlns="http://www.w3.org/2000/svg" width="760" height="378" viewBox="0 0 760 378" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <rect width="760" height="378" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="28" y="34" font-size="17" font-weight="700" fill="#0f172a">Policy Explainability: Boundary Margins, Feature Attribution &amp; Counterfactuals</text>
  <text x="28" y="54" font-size="12.5" fill="#475569">Why the controller selects each profile across the 4 operating regimes in sealed KVM evaluation</text>
  
    <rect x="24" y="74" width="350" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="38" y="96" font-size="13" font-weight="700" fill="#0f172a">1. Under-Capacity (35% load) (s12-u35/301)</text>
    <rect x="282" y="82" width="78" height="20" rx="4" fill="#dcfce7"/>
    <text x="321" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">-&gt; latency</text>
    <text x="38" y="118" font-size="11.5" font-weight="600" fill="#334155">Threshold: pending=1 vs cut=14.5 (margin=-13.5 jobs)</text>
    <text x="38" y="138" font-size="11" fill="#475569">Regime: under_capacity | max_wait=61.1ms | lat_share=0.30</text>
    <text x="38" y="158" font-size="11" fill="#475569">Logistic (latency, P=0.98): log1p_q=+1.15, wait=+0.94, share=+0.40</text>
    <rect x="38" y="170" width="322" height="24" rx="4" fill="#f1f5f9"/>
    <text x="46" y="186" font-size="11" font-weight="600" fill="#0f172a">Counterfactual: p99: 76.2ms (2.22x vs balanced), batch: 98.7%</text>
    
    <rect x="386" y="74" width="350" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="400" y="96" font-size="13" font-weight="700" fill="#0f172a">2. Unseen Boundary (45% load) (s12-u45/312)</text>
    <rect x="644" y="82" width="78" height="20" rx="4" fill="#dcfce7"/>
    <text x="683" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">-&gt; latency</text>
    <text x="400" y="118" font-size="11.5" font-weight="600" fill="#334155">Threshold: pending=9 vs cut=14.5 (margin=-5.5 jobs)</text>
    <text x="400" y="138" font-size="11" fill="#475569">Regime: under_capacity | max_wait=239.3ms | lat_share=0.49</text>
    <text x="400" y="158" font-size="11" fill="#475569">Logistic (reclaim, P=0.38): log1p_q=-0.05, wait=+0.06, share=+0.38</text>
    <rect x="400" y="170" width="322" height="24" rx="4" fill="#f1f5f9"/>
    <text x="408" y="186" font-size="11" font-weight="600" fill="#0f172a">Counterfactual: p99: 88.2ms (2.57x vs balanced), batch: 98.8%</text>
    
    <rect x="24" y="218" width="350" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="38" y="240" font-size="13" font-weight="700" fill="#0f172a">3. Unseen Overload (72% load) (s12-u72/311)</text>
    <rect x="282" y="226" width="78" height="20" rx="4" fill="#fef3c7"/>
    <text x="321" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">-&gt; reclaim</text>
    <text x="38" y="262" font-size="11.5" font-weight="600" fill="#334155">Threshold: pending=56 vs cut=14.5 (margin=+41.5 jobs)</text>
    <text x="38" y="282" font-size="11" fill="#475569">Regime: overload_shedding | max_wait=984.8ms | lat_share=0.50</text>
    <text x="38" y="302" font-size="11" fill="#475569">Logistic (reclaim, P=0.55): log1p_q=+0.39, wait=+0.73, share=+0.41</text>
    <rect x="38" y="314" width="322" height="24" rx="4" fill="#f1f5f9"/>
    <text x="46" y="330" font-size="11" font-weight="600" fill="#0f172a">Counterfactual: batch retained: 100.0% (vs 50.0% if latency)</text>
    
    <rect x="386" y="218" width="350" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="400" y="240" font-size="13" font-weight="700" fill="#0f172a">4. OOD 32ms Jobs (65% load) (s32-u65/401)</text>
    <rect x="644" y="226" width="78" height="20" rx="4" fill="#fef3c7"/>
    <text x="683" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">-&gt; reclaim</text>
