<text x="28" y="36" text-anchor="start" font-size="15" font-weight="800" fill="#ff2a2a">Real-data unikernel benchmarks</text><text x="28" y="56" text-anchor="start" font-size="11" font-weight="500" fill="#a3a3a3">Left: live HMAC-SHA256 + JSON RPC (--real-workload). Right: 252 sealed KVM branch decisions (jobs-v2).</text>
