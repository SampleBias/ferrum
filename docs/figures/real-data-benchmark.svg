<text x="44" y="126" text-anchor="start" font-size="11" font-weight="500" fill="#a3a3a3">168 open-loop RPCs + 8 KiB batch blocks</text>
<text x="44" y="154" text-anchor="start" font-size="12" font-weight="700" fill="#ff2a2a">RPC p99 latency, lower is better</text>
<text x="186" y="180" text-anchor="end" font-size="12" font-weight="700" fill="#e8e8e8">balanced 1:1:1</text>
