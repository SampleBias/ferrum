<text x="44" y="274" text-anchor="start" font-size="12" font-weight="500" fill="#c8c8c8">Static balanced:  p50 16.7 ms   p95 39.9 ms   1022 MiB</text>
<text x="44" y="294" text-anchor="start" font-size="12" font-weight="700" fill="#ff3a3a">Adaptive policy:  p50 8.0 ms   p95 15.6 ms   1036 MiB</text>
